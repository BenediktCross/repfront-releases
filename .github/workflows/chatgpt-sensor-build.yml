name: Build Sensor APK

on:
  push:
    branches:
      - chatgpt-sensor-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: sensor-build
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp sensor-build/app/build/outputs/apk/debug/app-debug.apk PixelSensorDashboard.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelSensorDashboard-APK
          path: PixelSensorDashboard.apk
          if-no-files-found: error
